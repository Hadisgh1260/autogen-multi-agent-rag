
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGen RAG Team - Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat-body">
    <div class="app">
        <header class="topbar">
            <div class="topbar-left">
                <button
                    id="sidebarToggle"
                    class="sidebar-toggle"
                    type="button"
                    aria-label="Open chat history"
                    title="Chat history"
                >☰</button>

                <div class="brand">
                    <h1>AutoGen RAG Team</h1>
                    <p>Backend &amp; Frontend AI Assistant</p>
                </div>
            </div>

            <div class="topbar-actions">
                <span id="usernameDisplay" class="username-display"></span>
                <button id="logoutButton" class="logout-button" type="button">
                    Log out
                </button>
            </div>
        </header>

        <div id="sidebarOverlay"></div>

        <div class="chat-layout">
            <aside id="chatSidebar" class="chat-sidebar">
                <div class="sidebar-header">
                    <h2>Chat history</h2>

                    <button
                        id="closeSidebarButton"
                        class="close-sidebar-button"
                        type="button"
                        aria-label="Close chat history"
                        title="Close"
                    >×</button>
                </div>

                <button id="newChatButton" class="new-chat-button" type="button">
                    <span aria-hidden="true">＋</span>
                    New Chat
                </button>

                <div id="chatHistory" class="chat-history">
                    <p class="chat-history-empty">Loading chats...</p>
                </div>
            </aside>

            <main class="chat-container">
                <div id="chatError" class="chat-error" hidden></div>

                <section
                    id="messages"
                    class="messages"
                    aria-live="polite"
                    aria-label="Chat messages"
                >
                    <div class="welcome-message">
                        <h2>How can I help you today?</h2>
                        <p>
                            Ask me a backend, frontend, or software-engineering question.
                        </p>
                    </div>
                </section>

                <div id="blockBox" class="block-box" hidden></div>

                <footer class="chat-footer">
                    <form id="chatForm" class="chat-form">
                        <textarea
                            id="question"
                            name="question"
                            placeholder="Ask your question..."
                            rows="1"
                            required
                            aria-label="Your question"
                        ></textarea>

                        <button id="sendButton" type="submit">
                            Send
                        </button>
                    </form>

                    <div class="chat-footer-info">
                        <span>
                            Off-topic attempts:
                            <span id="offTopicCounter">0/3</span>
                        </span>

                        <span class="chat-hint">
                            Press Enter to send · Shift + Enter for a new line
                        </span>
                    </div>
                </footer>
            </main>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
