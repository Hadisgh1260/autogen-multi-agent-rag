<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AutoGen RAG Team - Login</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="logo">
                AI
            </div>

            <h1>AutoGen RAG Team</h1>

            <p class="subtitle">
                Backend & Frontend AI Assistant
            </p>

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>

            </form>

            <div
                id="loginError"
                class="error-message hidden"
            ></div>

        </div>

    </main>

    <script src="/static/app.js"></script>

</body>

</html>
